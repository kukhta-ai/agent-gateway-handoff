  tea:          {spawned: true, id: "afcc13c75f32bf15b", role: "test design / framework / ci / gate", last_skill: "bmad-testarch-test-design (interactive->docs-driven fallback) -> docs/architecture/test-strategy.md"}
  sm:           {spawned: false, role: "sprint setup + create-story",                         last_skill: null}
