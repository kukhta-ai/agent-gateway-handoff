# Authoritative position in the BMAD-based SDLC defined by AGENTS.md + docs/SDLC.md.
# Re-read on every resume; update at every phase boundary.
# (Distinct from _bmad/ — that is BMAD's own install dir; this dot-dir is our tracker.)

phase: 3
phase_name: "Solutioning + test architecture"
branch: feature/scenario-01
epic: scenario-01            # the whole MVP = deliver scenario-01 end to end
active_story: GLA-004        # wave 2: implement the kernel (critical path); GLA-007..011 wpm pkgs also unblocked
review_cycle: 2              # cycle 1 found a capability-token blocker (parentRef/lineage unsigned -> revocation bypass) + 3 gaps; fixed (lineage now signed, all-ancestors checked, scope fail-closed, recursive canonical); cycle 2 = focused re-review in progress
# Phase-3 test architecture produced: docs/architecture/test-strategy.md (tea, docs-driven fallback) —
# pyramid (unit/contract/E2E), scenario-01 E2E harness (virtual WebAuthn authenticator + channel-cli + stub acme site + process-tier launcher), 10 security invariants gating GLA-066.
done: [GLA-001, GLA-002, GLA-003, GLA-005]   # architecture baseline; kernel contracts; scaffold+gate (green); dependency strategy
# Foundation artifacts: docs/architecture/{baseline,kernel-contracts,dependency-strategy}.md + the building pnpm
# workspace skeleton (15 packages + 11 adapters + 2 surfaces). Quality gate `pnpm gate` verified green.
# Note: backlog has a global definitionOfDone but no per-task DoD checkboxes -> DoD enforced via pnpm gate/CI, not --check-dod.
# Rule-3 so far: bmad architecture skills load in subagents but are interactive/PRD-gated -> docs-driven fallback (recorded per task).
# GLA-003 scaffold was a direct TS engineering task (tooling, not a BMAD story); GLA-004+ will attempt bmad-dev-story/quick-dev.

# Spec-exists project: Phases 1-2 are CONFORMANCE — the committed docs/ ARE the brief/PRD/UX.
# Phase 3 concretizes what the docs leave open: the stack, the scaffold, the quality gate, test arch.
conformance:
  phase_1_analysis: "design set docs/00-product-overview.md + actors-and-personas.md ARE the product brief (conformed)"
  phase_2_planning: "design set docs/01..05 + components/ ARE the PRD/architecture (conformed); product has a UI (capsule surfaces)"

