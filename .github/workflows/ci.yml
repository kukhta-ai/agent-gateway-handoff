# Continuous integration — the project quality gate.
#
# Runs the SAME gate a contributor runs locally and the pre-commit hook runs on staged files
# (CONTRIBUTING.md > "Quality gate"). CI's added value is BREADTH (the support matrix), not a different or
# stronger gate.
#
# This template ships a stack-AGNOSTIC skeleton. The placeholder gate steps below FAIL ON PURPOSE so an
# unconfigured gate is loudly red rather than silently green. Replace them with your stack's real
# build/type-check, lint/format, and test commands, set up your toolchain, and adjust the matrix — keeping
# the three steps identical to CONTRIBUTING.md > "Quality gate".
#
# "A failure blocks merge": a failing run reports a red status on the push/PR. Turning that into a *required*
# check that actually prevents merging is a GitHub branch-protection SETTING (repo admin, human-owned —
# SDLC Phase 7); it is not configured here, by design.
#
# Security note: no untrusted event input (issue/PR/commit text) is used in any run: step; the only
# expression interpolations are trusted matrix values and github.workflow/github.ref — no injection surface.

name: CI

on:
  # Every push to any branch is checked (covers the working/story branches).
  push:
  # Every pull request targeting the integration/release branches is checked.
  pull_request:
    branches: [dev, main]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel other cells when one fails — we want the full cross-platform picture.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # TODO: add macos-latest / windows-latest if you support them, and a runtime-version axis, e.g.:
        #   node: [20, 22]   (then reference ${{ matrix.node }} in a setup-node step)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Toolchain: TypeScript / Node 22 + pnpm (docs/architecture/baseline.md §1).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install human-view E2E runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc websockify

      # Browser-backed E2Es are part of the Definition of Done. Install the Playwright Chromium
      # runtime and Linux launch dependencies before the single gate entrypoint runs, so missing
      # browser support is a red CI check rather than a silently skipped E2E.
      - name: Install browser E2E runtime
        run: pnpm dlx playwright@1.60.0 install --with-deps chromium

      # The quality gate — the SAME single entrypoint a contributor runs locally and the pre-commit
      # hook runs (CONTRIBUTING.md > "Quality gate"). `pnpm gate` runs, in order, failing on the first
      # non-zero exit: tsc -b (build/type-check) -> biome ci . (lint/format + module-boundary rule) ->
      # browser E2E preflight -> vitest run (tests, incl. the boundary-violation guard test).
      - name: Quality gate
        run: pnpm gate

      # Belt-and-braces: prove the gate cannot be silently bypassed — the boundary lint rejects a
      # known-bad sample as a non-zero result (this is green only when the guard is healthy).
      - name: Boundary-guard selftest
        run: pnpm gate:selftest
